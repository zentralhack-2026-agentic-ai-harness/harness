[project]
name = "harness"
version = "0.1.0"
description = "Minimal agent harness for Zentral Hack 2026: an LLM with one bash tool"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["openai>=2"]

[project.scripts]
harness = "harness.cli:main"

[dependency-groups]
dev = ["ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
